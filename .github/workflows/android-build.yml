name: ZX SplitPlay CI - Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle Wrapper
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew testDebugUnitTest --no-daemon
          else
            gradle testDebugUnitTest --no-daemon
          fi

      - name: Assemble Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verify Generated APK
        run: |
          mkdir -p build-artifacts
          APK_FILE=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::File APK tidak ditemukan di app/build/outputs/apk/debug/"
            exit 1
          fi
          if [ ! -s "$APK_FILE" ]; then
            echo "::error::File APK ditemukan tetapi berukuran 0 byte (kosong)!"
            exit 1
          fi
          echo "APK berhasil dibangun di: $APK_FILE"
          cp "$APK_FILE" build-artifacts/ZX-SplitPlay-debug.apk
          ls -la build-artifacts/ZX-SplitPlay-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZX-SplitPlay-debug-apk
          path: build-artifacts/ZX-SplitPlay-debug.apk
          if-no-files-found: error
          retention-days: 30
